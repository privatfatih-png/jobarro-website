<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="25%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="180" r="200" fill="#2563EB" fill-opacity="0.07"/>
  <circle cx="1130" cy="480" r="130" fill="#2563EB" fill-opacity="0.05"/>

  <!-- Logo icon -->
  <rect x="80" y="72" width="60" height="60" rx="14" fill="#2563EB"/>
  <rect x="90" y="98" width="9" height="20" rx="3" fill="white"/>
  <rect x="106" y="86" width="9" height="32" rx="3" fill="white"/>
  <rect x="122" y="92" width="9" height="26" rx="3" fill="white"/>

  <!-- Jobarro wordmark -->
  <text x="154" y="114" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="white" letter-spacing="-0.5">Jobarro</text>

  <!-- Divider -->
  <rect x="80" y="168" width="60" height="3" rx="2" fill="#2563EB"/>

  <!-- Main headline -->
  <text x="80" y="290" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="white" letter-spacing="-2.5">Real-Time AI</text>
  <text x="80" y="388" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="#60A5FA" letter-spacing="-2.5">Interview Copilot</text>

  <!-- Subheading -->
  <text x="80" y="452" font-family="Arial, sans-serif" font-weight="400" font-size="26" fill="#64748B">Answers in under 1 sec - invisible to screen sharing.</text>

  <!-- Badge -->
  <rect x="80" y="492" width="272" height="48" rx="24" fill="#2563EB"/>
  <text x="216" y="522" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="white" text-anchor="middle">Download for Windows</text>

  <!-- URL bottom right -->
  <text x="1120" y="580" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#334155" text-anchor="end">jobarro.com</text>
</svg>
